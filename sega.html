<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Emulator Sega Genesis</title>
  <link rel="stylesheet" href="diamonds.css">
  <style>:root{--p:#0070f3}</style>
</head>
<body>
  <header>
    <div class="brand-wrap"><a href="sega.html" class="brand">DIAMONDS</a><span class="badge">EMULATOR SEGA</span></div>
    <nav>
      <a href="nes.html" class="nav-btn" style="--c:#ff6b81">🔴 NES</a>
      <a href="snes.html" class="nav-btn" style="--c:#a55eea">🟣 SNES</a>
      <a href="sega.html" class="nav-btn active" style="--c:#50e3c2">⚡ Sega Genesis</a>
      <a href="gba.html" class="nav-btn" style="--c:#2ed573">🟢 Game Boy</a>
    </nav>
    <div class="search"><input type="text" id="searchInput" placeholder="Buscar juego de Sega Genesis..." aria-label="Buscar juego"></div>
  </header>

  <main>
    <div class="section-title">🕹️ Catálogo de Sega Genesis / Mega Drive <small id="count"></small></div>
    <div class="games-grid" id="gamesGrid"></div>

    <div class="ad-wrapper">
      <div class="ad-tag">Publicidad Patrocinada</div>
      <script async="async" data-cfasync="false" src="https://pl31042827.profitableratecpmnetwork.com/f39ca1dab3c6020bea8bd186bd796ce9/invoke.js"></script>
      <div id="container-f39ca1dab3c6020bea8bd186bd796ce9"></div>
    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">Sega Player</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar (Esc)">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    window.D = {
      badge: "Sega", search: "Sega",
      games: [
        { id: 1, title: "Sonic The Hedgehog", image: "https://thumbnails.libretro.com/Sega%20-%20Mega%20Drive%20-%20Genesis/Named_Boxarts/Sonic%20The%20Hedgehog%20(USA%2C%20Europe).png", url: "sonic.html" },
        { id: 2, title: "FIFA 98 - Road to World Cup", image: "https://thumbnails.libretro.com/Sega%20-%20Mega%20Drive%20-%20Genesis/Named_Boxarts/FIFA%2098%20-%20Road%20to%20World%20Cup%20(Europe)%20(En%2CFr%2CEs%2CIt%2CSv).png", url: "fifa98.html" }
      ]
    };
  </script>
  <script src="diamonds.js"></script>
