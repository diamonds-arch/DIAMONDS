<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Emulator NES</title>
  <link rel="stylesheet" href="diamonds.css">
  <style>:root{--p:#ff4757}</style>
</head>
<body>
  <header>
    <div class="brand-wrap"><a href="nes.html" class="brand">DIAMONDS</a><span class="badge">EMULATOR NES</span></div>
    <nav>
      <a href="nes.html" class="nav-btn active" style="--c:#ff6b81">🔴 NES</a>
      <a href="snes.html" class="nav-btn" style="--c:#a55eea">🟣 SNES</a>
      <a href="sega.html" class="nav-btn" style="--c:#50e3c2">⚡ Sega Genesis</a>
      <a href="gba.html" class="nav-btn" style="--c:#2ed573">🟢 Game Boy</a>
    </nav>
    <div class="search"><input type="text" id="searchInput" placeholder="Buscar juego de NES..." aria-label="Buscar juego"></div>
  </header>

  <main>
    <div class="section-title">🕹️ Catálogo de Nintendo Entertainment System <small id="count"></small></div>
    <div class="games-grid" id="gamesGrid"></div>

    <div class="ad-wrapper">
      <div class="ad-tag">Publicidad Patrocinada</div>
      <script async="async" data-cfasync="false" src="https://pl31042827.profitableratecpmnetwork.com/f39ca1dab3c6020bea8bd186bd796ce9/invoke.js"></script>
      <div id="container-f39ca1dab3c6020bea8bd186bd796ce9"></div>
    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">NES Player</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar (Esc)">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    window.D = {
      badge: "NES", search: "NES",
      games: [
        { id: 1, title: "Galaga", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Galaga%20-%20Demons%20of%20Death%20(USA).png", url: "galaga.html" },
        { id: 2, title: "Arkanoid", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Arkanoid%20(USA).png", url: "arkanoid.html" },
        { id: 3, title: "Donkey Kong (NES)", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Donkey%20Kong%20(World)%20(Rev%20A).png", url: "dk.html" },
        { id: 4, title: "Space Invaders NES", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Space%20Invaders%20(Japan).png", url: "spaceinvaders.html" },
        { id: 5, title: "Bubble Bobble NES", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Bubble%20Bobble%20(USA).png", url: "bubblebobble.html" },
        { id: 6, title: "Frogger Classic", image: "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%20Entertainment%20System/Named_Boxarts/Frogger%20(USA)%20(Proto).png", url: "frogger.html" }
      ]
    };
  </script>
  <script src="diamonds.js"></script>
</body>
</html>
