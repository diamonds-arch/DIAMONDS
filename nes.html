<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Emulator NES</title>
  <style>
    :root {
      --bg-color: #0f141f;
      --card-bg: #182235;
      --primary: #ff4757;
      --accent: #2ed573;
      --text-color: #ffffff;
      --text-muted: #8c9fb5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 20, 31, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 2px solid rgba(255, 71, 87, 0.25);
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }

    .badge-nes {
      background: var(--primary);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn.nes-btn {
      background: rgba(255, 71, 87, 0.25);
      border-color: var(--primary);
      color: #ff6b81;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.35);
    }

    .nav-btn.snes-btn:hover {
      background: rgba(165, 94, 234, 0.2);
      border-color: #a55eea;
      color: #a55eea;
      box-shadow: 0 0 15px rgba(165, 94, 234, 0.4);
    }

    .nav-btn.sega-btn:hover {
      background: rgba(0, 112, 243, 0.2);
      border-color: #0070f3;
      color: #50e3c2;
      box-shadow: 0 0 15px rgba(0, 112, 243, 0.4);
    }

    .nav-btn.gba-btn:hover {
      background: rgba(46, 213, 115, 0.2);
      border-color: #2ed573;
      color: #2ed573;
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.4);
    }

    .search-bar {
      flex: 0 1 320px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.65rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
    }

    main {
      flex: 1;
      padding: 2.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.35);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.7rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.5) 60%, transparent);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .ad-wrapper {
      margin-top: 3rem;
      padding: 1.5rem;
      background: rgba(24, 34, 53, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ad-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.4);
      position: relative;
    }

    .modal-content.fullscreen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      background: #182235;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-action:hover {
      color: var(--primary);
    }

    .modal-content iframe {
      width: 100%;
      flex: 1;
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <a href="nes.html" class="brand">DIAMONDS</a>
      <span class="badge-nes">EMULATOR NES</span>
    </div>

    <nav class="nav-links">
      <a href="nes.html" class="nav-btn nes-btn">🔴 NES</a>
      <a href="snes.html" class="nav-btn snes-btn">🟣 SNES</a>
      <a href="sega.html" class="nav-btn sega-btn">⚡ Sega Genesis</a>
      <a href="gba.html" class="nav-btn gba-btn">🟢 Game Boy</a>
    </nav>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar juego de NES...">
    </div>
  </header>

  <main>
    <div class="section-title">🕹️ Catálogo de Nintendo Entertainment System</div>
    <div class="games-grid" id="gamesGrid"></div>

    <div class="ad-wrapper">
      <div class="ad-tag">Publicidad Patrocinada</div>
      <script async="async" data-cfasync="false" src="https://pl31042827.profitableratecpmnetwork.com/f39ca1dab3c6020bea8bd186bd796ce9/invoke.js"></script>
      <div id="container-f39ca1dab3c6020bea8bd186bd796ce9"></div>
    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">NES Player</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    const nesGames = [
      { id: 1, title: "Galaga", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23050811'/><polygon points='150,80 180,140 160,140 165,170 135,170 140,140 120,140' fill='%23ff4757'/><polygon points='150,95 165,130 135,130' fill='%23ffffff'/><circle cx='80' cy='60' r='2' fill='%23fff'/><circle cx='220' cy='90' r='3' fill='%232ed573'/><circle cx='60' cy='180' r='2' fill='%23ffa502'/><circle cx='240' cy='200' r='2' fill='%231e90ff'/><text x='150' y='250' font-family='monospace' font-size='22' font-weight='900' fill='%23ff4757' text-anchor='middle'>GALAGA</text></svg>", url: "galaga.html" },
      { id: 2, title: "Arkanoid", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%230b0f19'/><rect x='40' y='60' width='60' height='20' rx='4' fill='%23ff4757'/><rect x='120' y='60' width='60' height='20' rx='4' fill='%232ed573'/><rect x='200' y='60' width='60' height='20' rx='4' fill='%231e90ff'/><rect x='80' y='90' width='60' height='20' rx='4' fill='%23ffa502'/><rect x='160' y='90' width='60' height='20' rx='4' fill='%23e056fd'/><circle cx='150' cy='160' r='10' fill='%23ffffff'/><rect x='105' y='210' width='90' height='16' rx='8' fill='%2370a1ff'/><text x='150' y='265' font-family='monospace' font-size='20' font-weight='900' fill='%2370a1ff' text-anchor='middle'>ARKANOID</text></svg>", url: "arkanoid.html" },
      { id: 3, title: "Donkey Kong Classics", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23190a05'/><ellipse cx='150' cy='130' rx='60' ry='45' fill='%23854d0e'/><rect x='130' y='140' width='40' height='40' fill='%23ff4757' transform='rotate(45 150 160)'/><text x='150' y='167' font-family='sans-serif' font-size='15' font-weight='bold' fill='%23fef08a' text-anchor='middle'>DK</text><rect x='30' y='220' width='240' height='12' fill='%23e74c3c'/><text x='150' y='265' font-family='monospace' font-size='18' font-weight='900' fill='%23eab308' text-anchor='middle'>DONKEY KONG</text></svg>", url: "https://funhtml5games.com/donkeykong/index.html" },
      { id: 4, title: "Space Invaders NES", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23000000'/><rect x='110' y='90' width='80' height='60' rx='10' fill='%232ed573'/><circle cx='130' cy='115' r='8' fill='%23000'/><circle cx='170' cy='115' r='8' fill='%23000'/><rect x='90' y='105' width='15' height='30' fill='%232ed573'/><rect x='195' y='105' width='15' height='30' fill='%232ed573'/><text x='150' y='250' font-family='monospace' font-size='18' font-weight='900' fill='%232ed573' text-anchor='middle'>SPACE INVADERS</text></svg>", url: "https://funhtml5games.com/spaceinvaders/index.html" },
      { id: 5, title: "Bubble Bobble NES", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23071a12'/><circle cx='150' cy='130' r='55' fill='%232ed573'/><circle cx='135' cy='115' r='12' fill='%23ffffff'/><circle cx='135' cy='115' r='6' fill='%23000000'/><circle cx='80' cy='70' r='18' fill='none' stroke='%237bed9f' stroke-width='4'/><circle cx='220' cy='90' r='14' fill='none' stroke='%237bed9f' stroke-width='4'/><text x='150' y='250' font-family='monospace' font-size='18' font-weight='900' fill='%237bed9f' text-anchor='middle'>BUBBLE BOBBLE</text></svg>", url: "https://funhtml5games.com/bubblebobble/index.html" },
      { id: 6, title: "Frogger Classic", image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%230a192f'/><circle cx='150' cy='135' rx='50' ry='40' fill='%232ecc71'/><circle cx='120' cy='105' r='14' fill='%23ffffff'/><circle cx='120' cy='105' r='7' fill='%23000'/><circle cx='180' cy='105' r='14' fill='%23ffffff'/><circle cx='180' cy='105' r='7' fill='%23000'/><rect x='30' y='210' width='240' height='14' fill='%2395a5a6'/><text x='150' y='260' font-family='monospace' font-size='20' font-weight='900' fill='%232ecc71' text-anchor='middle'>FROGGER</text></svg>", url: "https://funhtml5games.com/frogger/index.html" }
    ];

    const grid = document.getElementById('gamesGrid');
    const modal = document.getElementById('gameModal');
    const modalContainer = document.getElementById('modalContainer');
    const gameFrame = document.getElementById('gameFrame');
    const modalTitle = document.getElementById('modalTitle');
    const closeModal = document.getElementById('closeModal');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const searchInput = document.getElementById('searchInput');

    function renderGames(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No se encontraron juegos de NES.</p>';
        return;
      }
      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}" loading="lazy">
          <div class="game-title">${game.title}</div>
        `;
        card.addEventListener('click', () => {
          modalTitle.textContent = game.title + " (NES)";
          gameFrame.src = game.url;
          modal.classList.add('open');
          setTimeout(() => {
            gameFrame.focus();
            if (gameFrame.contentWindow) gameFrame.contentWindow.focus();
          }, 150);
        });
        grid.appendChild(card);
      });
    }

    closeModal.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      modal.classList.remove('open');
      modalContainer.classList.remove('fullscreen');
      gameFrame.src = '';
    });

    fullscreenBtn.addEventListener('click', () => {
      fullscreenBtn.blur();
      if (!document.fullscreenElement) {
        modalContainer.requestFullscreen().catch(() => {
          modalContainer.classList.toggle('fullscreen');
        });
      } else {
        document.exitFullscreen();
      }
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      renderGames(nesGames.filter(g => g.title.toLowerCase().includes(term)));
    });

    renderGames(nesGames);
  </script>
</body>
</html>
