<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FIFA 98</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'segaMD'; // Si bajaste la de SNES, cámbialo a 'snes'
    EJS_gameUrl = './fifa98.bin'; // Si es de SNES, pon './fifa98.sfc'
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
