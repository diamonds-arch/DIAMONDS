<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Juegos Online Gratis</title>
  <style>
    :root {
      --bg-color: #121927;
      --card-bg: #1c2638;
      --primary: #00d2ff;
      --text-color: #ffffff;
      --text-muted: #8c9fb5;
      --accent: #3a7bd5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(18, 25, 39, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #00d2ff, #92fe9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .search-bar {
      flex: 0 1 400px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
      transition: 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    .categories {
      display: flex;
      gap: 0.8rem;
      padding: 1rem 2rem;
      overflow-x: auto;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #fff;
    }

    main {
      flex: 1;
      padding: 1rem 2rem 3rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.2rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      background-color: #0b111e;
    }

    .game-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.4) 60%, transparent);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 960px;
      height: 80vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
      position: relative;
      transition: all 0.3s ease;
    }

    .modal-content.fullscreen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      background: var(--card-bg);
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-action:hover {
      color: var(--primary);
    }

    .modal-content iframe {
      width: 100%;
      flex: 1;
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">DIAMONDS</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar juegos...">
    </div>
  </header>

  <nav class="categories">
    <button class="cat-btn active" data-category="all">Todos</button>
    <button class="cat-btn" data-category="arcade">Arcade</button>
    <button class="cat-btn" data-category="accion">Acción</button>
    <button class="cat-btn" data-category="puzzle">Puzzle</button>
  </nav>

  <main>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">Título del Juego</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    const games = [
      {
        id: 1,
        title: "Space Invaders",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/commons/1/15/Space_invaders_alien.png",
        url: "https://straker.github.io/space-invaders/"
      },
      {
        id: 2,
        title: "Asteroids Arcade",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/en/thumb/e/e0/Missile_command.svg/1200px-Missile_command.svg.png",
        url: "https://straker.github.io/asteroids/"
      },
      {
        id: 3,
        title: "Pong Retro",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Pong.png/640px-Pong.png",
        url: "https://gorisanson.github.io/pong-game/"
      },
      {
        id: 4,
        title: "Pacman Classic",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Pacman_HD.png/640px-Pacman_HD.png",
        url: "https://freepacman.org/"
      },
      {
        id: 5,
        title: "Super Mario HTML5",
        category: "accion",
        image: "https://upload.wikimedia.org/wikipedia/en/a/a9/MarioSMBW.png",
        url: "https://chanmeng666.github.io/super-mario-makey-makey/"
      },
      {
        id: 6,
        title: "Flappy Bird",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/en/0/0a/Flappy_Bird_icon.png",
        url: "https://nebez.github.io/floppybird/"
      },
      {
        id: 7,
        title: "Tower Building",
        category: "puzzle",
        image: "https://raw.githubusercontent.com/iamkun/tower_game/master/assets/screenshot.png",
        url: "https://iamkun.github.io/tower_game/"
      },
      {
        id: 8,
        title: "Tetris Clásico",
        category: "puzzle",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Tetrominoes_IJLO_STZ_flipped.svg/640px-Tetrominoes_IJLO_STZ_flipped.svg.png",
        url: "https://chvin.github.io/react-tetris/"
      },
      {
        id: 9,
        title: "Chrome Dino T-Rex",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/commons/a/ac/T-Rex_icon_from_Chromium.png",
        url: "https://elgoog.im/t-rex/"
      },
      {
        id: 10,
        title: "Connect 4 (4 en Línea)",
        category: "puzzle",
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Connect_Four.svg/640px-Connect_Four.svg.png",
        url: "https://kenrick95.github.io/c4/"
      },
      {
        id: 11,
        title: "Frogger Arcade",
        category: "arcade",
        image: "https://upload.wikimedia.org/wikipedia/en/thumb/1/1c/Frogger_arcade_flyer.jpg/220px-Frogger_arcade_flyer.jpg",
        url: "https://funhtml5games.com/frogger/index.html"
      },
      {
        id: 12,
        title: "Lunar Lander Retro",
        category: "arcade",
        image: "https://m.media-amazon.com/images/I/71YyvP1r0OL.png",
        url: "https://straker.github.io/lunar-lander/"
      }
    ];

    const grid = document.getElementById('gamesGrid');
    const modal = document.getElementById('gameModal');
    const modalContainer = document.getElementById('modalContainer');
    const gameFrame = document.getElementById('gameFrame');
    const modalTitle = document.getElementById('modalTitle');
    const closeModal = document.getElementById('closeModal');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const searchInput = document.getElementById('searchInput');
    const categoryButtons = document.querySelectorAll('.cat-btn');

    function renderGames(gameList) {
      grid.innerHTML = '';
      if (gameList.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No se encontraron juegos.</p>';
        return;
      }
      gameList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}" loading="lazy">
          <div class="game-title">${game.title}</div>
        `;
        card.addEventListener('click', () => openGame(game));
        grid.appendChild(card);
      });
    }

    function refocusIframe() {
      setTimeout(() => {
        gameFrame.focus();
        if (gameFrame.contentWindow) {
          gameFrame.contentWindow.focus();
        }
      }, 150);
    }

    function openGame(game) {
      modalTitle.textContent = game.title;
      gameFrame.src = game.url;
      modal.classList.add('open');
      refocusIframe();
    }

    closeModal.addEventListener('click', () => {
      modal.classList.remove('open');
      modalContainer.classList.remove('fullscreen');
      gameFrame.src = '';
    });

    fullscreenBtn.addEventListener('click', () => {
      fullscreenBtn.blur();
      if (!document.fullscreenElement) {
        modalContainer.requestFullscreen().catch(() => {
          modalContainer.classList.toggle('fullscreen');
        });
      } else {
        document.exitFullscreen();
      }
      refocusIframe();
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        modalContainer.classList.add('fullscreen');
      } else {
        modalContainer.classList.remove('fullscreen');
      }
      refocusIframe();
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = games.filter(g => g.title.toLowerCase().includes(term));
      renderGames(filtered);
    });

    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.getAttribute('data-category');
        if (cat === 'all') {
          renderGames(games);
        } else {
          renderGames(games.filter(g => g.category === cat));
        }
      });
    });

    renderGames(games);
  </script>
</body>
</html>
