<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Emulator Game Boy Advance</title>
  <style>
    :root {
      --bg-color: #0f141f;
      --card-bg: #182235;
      --primary: #2ed573;
      --accent: #2ed573;
      --text-color: #ffffff;
      --text-muted: #8c9fb5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 20, 31, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 2px solid rgba(46, 213, 115, 0.25);
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
    }

    .badge-gba {
      background: var(--primary);
      color: #0f141f;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn.nes-btn:hover {
      background: rgba(255, 71, 87, 0.2);
      border-color: #ff4757;
      color: #ff6b81;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
    }

    .nav-btn.snes-btn:hover {
      background: rgba(165, 94, 234, 0.2);
      border-color: #a55eea;
      color: #a55eea;
      box-shadow: 0 0 15px rgba(165, 94, 234, 0.4);
    }

    .nav-btn.sega-btn:hover {
      background: rgba(0, 112, 243, 0.2);
      border-color: #0070f3;
      color: #50e3c2;
      box-shadow: 0 0 15px rgba(0, 112, 243, 0.4);
    }

    .nav-btn.gba-btn {
      background: rgba(46, 213, 115, 0.25);
      border-color: var(--primary);
      color: #2ed573;
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.35);
    }

    .search-bar {
      flex: 0 1 320px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.65rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.3);
    }

    main {
      flex: 1;
      padding: 2.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #f97316;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
    }

    .game-card .cover-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-card svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .game-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.7rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.5) 60%, transparent);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .ad-wrapper {
      margin-top: 3rem;
      padding: 1.5rem;
      background: rgba(24, 34, 53, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ad-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(249, 115, 22, 0.5);
      position: relative;
    }

    .modal-content.fullscreen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      background: #182235;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-action:hover {
      color: #f97316;
    }

    .modal-content iframe {
      width: 100%;
      flex: 1;
      border: none;
      background-color: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <a href="gba.html" class="brand">DIAMONDS</a>
      <span class="badge-gba">EMULATOR GBA</span>
    </div>

    <nav class="nav-links">
      <a href="nes.html" class="nav-btn nes-btn">🔴 NES</a>
      <a href="snes.html" class="nav-btn snes-btn">🟣 SNES</a>
      <a href="sega.html" class="nav-btn sega-btn">⚡ Sega Genesis</a>
      <a href="gba.html" class="nav-btn gba-btn">🟢 Game Boy</a>
    </nav>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar juego de Game Boy...">
    </div>
  </header>

  <main>
    <div class="section-title">🕹️ Catálogo de Game Boy Advance</div>
    <div class="games-grid" id="gamesGrid"></div>

    <div class="ad-wrapper">
      <div class="ad-tag">Publicidad Patrocinada</div>
      <script async="async" data-cfasync="false" src="https://pl31042827.profitableratecpmnetwork.com/f39ca1dab3c6020bea8bd186bd796ce9/invoke.js"></script>
      <div id="container-f39ca1dab3c6020bea8bd186bd796ce9"></div>
    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">GBA Player</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    // SVG RECREADO EXACTO DE LA PORTADA OFICIAL DE CHARIZARD
    const charizardCoverSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <defs>
          <radialGradient id="fireVortex" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffedd5"/>
            <stop offset="25%" stop-color="#fb923c"/>
            <stop offset="55%" stop-color="#ea580c"/>
            <stop offset="85%" stop-color="#991b1b"/>
            <stop offset="100%" stop-color="#450a0a"/>
          </radialGradient>
          
          <linearGradient id="charizardSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdba74"/>
            <stop offset="45%" stop-color="#ea580c"/>
            <stop offset="100%" stop-color="#9a3412"/>
          </linearGradient>

          <linearGradient id="wingInner" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#67e8f9"/>
            <stop offset="60%" stop-color="#0891b2"/>
            <stop offset="100%" stop-color="#164e63"/>
          </linearGradient>

          <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="100%" stop-color="#fde047"/>
          </linearGradient>

          <linearGradient id="tailFlame" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#dc2626"/>
            <stop offset="50%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#fef08a"/>
          </linearGradient>

          <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9"/>
          </filter>

          <filter id="boxShadow">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
          </filter>
        </defs>

        <!-- FONDO REMOLINO DE FUEGO -->
        <rect width="500" height="500" fill="url(#fireVortex)"/>

        <!-- Espirales dinámicas -->
        <g opacity="0.45" stroke="#fed7aa" stroke-width="8" fill="none" stroke-linecap="round">
          <path d="M250,250 C120,220 80,100 160,40 C260,-30 420,50 450,180 C480,310 390,440 240,460 C90,480 -10,330 20,180" />
          <path d="M250,250 C330,280 380,380 310,440 C220,500 80,410 50,300 C20,170 120,40 270,30" stroke="#f97316" stroke-width="14" />
          <path d="M250,250 C190,200 160,130 210,80 C270,30 380,80 390,160 C400,250 330,330 230,340" stroke="#ef4444" stroke-width="18" />
        </g>

        <!-- CHARIZARD CON CONTORNO BLANCO -->
        <g filter="url(#whiteGlow)">
          <!-- Ala Trasera -->
          <path d="M280,310 C240,260 250,210 300,190 C340,180 370,200 370,220 C340,240 330,280 280,310 Z" fill="#64748b" stroke="#1e293b" stroke-width="4"/>
          <path d="M280,310 C320,270 335,230 365,220 C325,240 310,270 280,310 Z" fill="#334155"/>

          <!-- Cola y Fuego -->
          <path d="M200,430 C150,420 100,360 90,320 C90,360 130,440 180,470 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
          <path d="M90,320 C70,300 70,280 85,260 C75,275 80,300 105,305 C115,290 110,270 115,250 C125,275 120,310 95,330 Z" fill="url(#tailFlame)" filter="url(#whiteGlow)"/>

          <!-- Ala Delantera -->
          <g>
            <path d="M220,310 C180,240 120,180 45,280 C65,180 160,150 220,190 C235,170 250,180 240,200 C230,220 230,270 220,310 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="5"/>
            <path d="M50,275 C100,200 180,185 220,205 C215,250 205,300 180,340 C145,345 100,315 50,275 Z" fill="url(#wingInner)" stroke="#0f172a" stroke-width="4"/>
            <path d="M120,230 Q160,250 180,340" stroke="#0891b2" stroke-width="3" fill="none"/>
            <path d="M80,260 Q130,265 155,340" stroke="#0891b2" stroke-width="3" fill="none"/>
          </g>

          <!-- Pata Izquierda -->
          <path d="M185,410 C180,445 200,470 230,470 C240,470 245,460 240,445 C235,430 220,410 185,410 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
          <polygon points="215,475 225,465 220,460" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
          <polygon points="230,475 238,463 232,458" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
          <polygon points="245,470 248,458 240,455" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>

          <!-- Pata Derecha -->
          <path d="M300,430 C305,450 320,455 330,440 C335,430 330,410 310,400 Z" fill="#c2410c" stroke="#1e293b" stroke-width="4"/>

          <!-- Cuerpo -->
          <path d="M220,300 C210,340 190,390 220,435 C250,445 300,420 310,365 C320,320 280,290 250,285 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="5"/>

          <!-- Barriga Amarilla -->
          <path d="M225,370 C220,400 235,430 260,430 C290,420 300,380 295,355 C280,365 245,375 225,370 Z" fill="url(#bellyGrad)" stroke="#1e293b" stroke-width="4"/>

          <!-- Brazo Delantero -->
          <path d="M305,335 C335,330 355,370 375,375 C370,390 350,385 335,375 C320,385 305,365 305,335 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
          <polygon points="375,375 385,380 375,390" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
          <polygon points="365,395 355,385 365,378" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>

          <!-- Cuello -->
          <path d="M250,285 C260,250 280,225 315,220 C325,255 295,290 265,305 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="5"/>

          <!-- Cabeza Rugiendo -->
          <g>
            <path d="M330,220 C320,195 295,200 280,215 C295,225 315,225 330,220 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
            <path d="M350,225 C375,210 395,215 405,225 C390,230 370,235 350,225 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
            <path d="M315,220 C335,220 370,230 405,245 C415,255 410,270 390,275 C365,280 345,265 330,260 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>

            <!-- Interior Boca -->
            <path d="M345,260 C360,270 385,275 390,275 C380,310 355,340 330,340 C320,335 320,300 335,270 Z" fill="#881337" stroke="#1e293b" stroke-width="4"/>
            <path d="M340,325 C355,325 365,305 355,295 C345,305 335,315 340,325 Z" fill="#f43f5e"/>
            <polygon points="380,270 385,280 390,275" fill="#f8fafc"/>
            <polygon points="360,265 365,275 370,267" fill="#f8fafc"/>
            <polygon points="335,335 340,325 345,335" fill="#f8fafc"/>

            <path d="M330,340 C345,340 375,300 395,280 C380,315 355,355 325,350 Z" fill="url(#charizardSkin)" stroke="#1e293b" stroke-width="4"/>
            <path d="M350,240 C365,238 375,245 370,252 C355,252 348,245 350,240 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
            <circle cx="363" cy="245" r="3.5" fill="#0284c7"/>
            <circle cx="364" cy="245" r="1.5" fill="#000000"/>
          </g>
        </g>

        <!-- LOGO POKÉMON -->
        <g filter="url(#boxShadow)" transform="translate(130, 20)">
          <!-- P -->
          <path d="M25,50 L25,15 L50,15 C65,15 75,25 75,35 C75,48 62,50 50,50 L38,50 L38,70 L25,70 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <path d="M25,50 L25,15 L50,15 C65,15 75,25 75,35 C75,48 62,50 50,50 L38,50 L38,70 L25,70 Z" fill="#fbbf24"/>
          <!-- O -->
          <ellipse cx="95" cy="45" rx="20" ry="25" fill="#2563eb" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <ellipse cx="95" cy="45" rx="20" ry="25" fill="#fbbf24"/>
          <ellipse cx="95" cy="45" rx="8" ry="12" fill="#1e3a8a"/>
          <!-- K -->
          <path d="M125,15 L140,15 L140,40 L158,15 L178,15 L152,45 L180,70 L160,70 L140,50 L140,70 L125,70 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <path d="M125,15 L140,15 L140,40 L158,15 L178,15 L152,45 L180,70 L160,70 L140,50 L140,70 L125,70 Z" fill="#fbbf24"/>
          <!-- E -->
          <path d="M185,25 L215,25 L215,38 L198,38 L198,43 L212,43 L212,53 L198,53 L198,60 L218,60 L218,70 L185,70 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round"/>
          <path d="M185,25 L215,25 L215,38 L198,38 L198,43 L212,43 L212,53 L198,53 L198,60 L218,60 L218,70 L185,70 Z" fill="#fbbf24"/>
          <polygon points="195,18 208,8 214,12 201,22" fill="#fbbf24" stroke="#1e3a8a" stroke-width="3"/>
        </g>

        <!-- BANNER EDICIÓN ROJO FUEGO -->
        <g filter="url(#boxShadow)" transform="translate(145, 95)">
          <path d="M10,20 L190,10 L200,45 L0,55 Z" fill="#000000" stroke="#ffffff" stroke-width="3"/>
          <text x="100" y="27" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" fill="#ffffff" letter-spacing="3" text-anchor="middle">EDICIÓN</text>
          <text x="100" y="47" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#f87171" stroke="#450a0a" stroke-width="1" letter-spacing="2" text-anchor="middle">ROJO FUEGO</text>
        </g>
      </svg>
    `;

    const gbaGames = [
      { 
        id: 1, 
        title: "Pokémon Rojo Fuego", 
        svgHtml: charizardCoverSVG, 
        url: "pokemonrojofuego.html" 
      }
    ];

    const grid = document.getElementById('gamesGrid');
    const modal = document.getElementById('gameModal');
    const modalContainer = document.getElementById('modalContainer');
    const gameFrame = document.getElementById('gameFrame');
    const modalTitle = document.getElementById('modalTitle');
    const closeModal = document.getElementById('closeModal');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const searchInput = document.getElementById('searchInput');

    function renderGames(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No se encontraron juegos de GBA.</p>';
        return;
      }
      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="cover-wrap">
            ${game.svgHtml}
          </div>
          <div class="game-title">${game.title}</div>
        `;
        card.addEventListener('click', () => {
          modalTitle.textContent = game.title + " (GBA)";
          gameFrame.src = game.url;
          modal.classList.add('open');
          setTimeout(() => {
            gameFrame.focus();
            if (gameFrame.contentWindow) gameFrame.contentWindow.focus();
          }, 150);
        });
        grid.appendChild(card);
      });
    }

    closeModal.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      modal.classList.remove('open');
      modalContainer.classList.remove('fullscreen');
      gameFrame.src = '';
    });

    fullscreenBtn.addEventListener('click', () => {
      fullscreenBtn.blur();
      if (!document.fullscreenElement) {
        modalContainer.requestFullscreen().catch(() => {
          modalContainer.classList.toggle('fullscreen');
        });
      } else {
        document.exitFullscreen();
      }
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      renderGames(gbaGames.filter(g => g.title.toLowerCase().includes(term)));
    });

    renderGames(gbaGames);
  </script>
</body>
</html>
