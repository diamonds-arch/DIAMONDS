<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMONDS - Emulator SNES</title>
  <link rel="stylesheet" href="diamonds.css">
  <style>:root{--p:#a55eea}</style>
</head>
<body>
  <header>
    <div class="brand-wrap"><a href="snes.html" class="brand">DIAMONDS</a><span class="badge">EMULATOR SNES</span></div>
    <nav>
      <a href="nes.html" class="nav-btn" style="--c:#ff6b81">🔴 NES</a>
      <a href="snes.html" class="nav-btn active" style="--c:#a55eea">🟣 SNES</a>
      <a href="sega.html" class="nav-btn" style="--c:#50e3c2">⚡ Sega Genesis</a>
      <a href="gba.html" class="nav-btn" style="--c:#2ed573">🟢 Game Boy</a>
    </nav>
    <div class="search"><input type="text" id="searchInput" placeholder="Buscar juego de SNES..." aria-label="Buscar juego"></div>
  </header>

  <main>
    <div class="section-title">🕹️ Catálogo de Super Nintendo <small id="count"></small></div>
    <div class="games-grid" id="gamesGrid"></div>

    <div class="ad-wrapper">
      <div class="ad-tag">Publicidad Patrocinada</div>
      <script async="async" data-cfasync="false" src="https://pl31042827.profitableratecpmnetwork.com/f39ca1dab3c6020bea8bd186bd796ce9/invoke.js"></script>
      <div id="container-f39ca1dab3c6020bea8bd186bd796ce9"></div>
    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalContainer">
      <div class="modal-header">
        <h3 id="modalTitle">SNES Player</h3>
        <div class="header-actions">
          <button class="btn-action" id="fullscreenBtn" title="Pantalla completa">⛶</button>
          <button class="btn-action" id="closeModal" title="Cerrar (Esc)">&times;</button>
        </div>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
    </div>
  </div>

  <script>
    window.D = {
      badge: "SNES", search: "SNES",
      games: [
        { id: 1, title: "Super Mario World", image: "https://thumbnails.libretro.com/Nintendo%20-%20Super%20Nintendo%20Entertainment%20System/Named_Boxarts/Super%20Mario%20World%20(USA).png", url: "mario.html" },
        { id: 2, title: "Super Mario Kart", image: "https://thumbnails.libretro.com/Nintendo%20-%20Super%20Nintendo%20Entertainment%20System/Named_Boxarts/Super%20Mario%20Kart%20(USA).png", url: "mariokart.html" },
        { id: 3, title: "DOOM", image: "https://thumbnails.libretro.com/Nintendo%20-%20Super%20Nintendo%20Entertainment%20System/Named_Boxarts/Doom%20(USA).png", url: "doom.html" },
        { id: 4, title: "Super Metroid", image: "super metroid.jpg", url: "metroid.html" }
      ]
    };
  </script>
  <script src="diamonds.js"></script>
</body>
</html>
